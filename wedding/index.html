function search(){const q=clean(input.value);results.replaceChildren();if(!q){close();clearSelection();return}const found=guests.filter(g=>q.split(/\s+/).every(part=>clean(g.name).includes(part)));results.hidden=false;input.setAttribute('aria-expanded','true');if(!found.length){const p=document.createElement('p');p.textContent='Name not found. Please check the spelling or ask for help.';results.append(p)}found.forEach(g=>{const b=document.createElement('button');b.type='button';b.setAttribute('role','option');const n=document.createElement('span');n.textContent=g.name;const t=document.createElement('small');t.textContent=tableLabel(g.table);b.append(n,t);b.onclick=()=>pick(g);b.onkeydown=e=>{if(e.key==='Escape'){close();input.focus()}if(e.key==='ArrowDown'){e.preventDefault();(b.nextElementSibling||results.firstElementChild).focus()}if(e.key==='ArrowUp'){e.preventDefault();(b.previousElementSibling||input).focus()}};results.append(b)})}
